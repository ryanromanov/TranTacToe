<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 270" width="260" height="270" role="img" aria-label="A game of TranTacToe in a terminal window: the computer, playing O, is one move from winning on the diagonal">
  <title>A game of TranTacToe in a terminal window</title>
  <style>
    .bg { fill: #2f3340; }
    .dot { fill: #4b5060; }
    .fg { fill: #ece6de; font: 400 14px ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; white-space: pre; }
    .cursor { fill: #b8553f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151925; }
      .dot { fill: #313849; }
      .fg { fill: #e6e4ef; }
      .cursor { fill: #f0a08b; }
    }
  </style>
  <rect class="bg" width="260" height="270" rx="10"/>
  <circle class="dot" cx="18" cy="15" r="4.5"/>
  <circle class="dot" cx="33" cy="15" r="4.5"/>
  <circle class="dot" cx="48" cy="15" r="4.5"/>
  <text class="fg" y="30" xml:space="preserve">
    <tspan x="16" dy="18">  ----- ----- -----</tspan>
    <tspan x="16" dy="18"> |  O  |  X  |  O  |</tspan>
    <tspan x="16" dy="18">  ----- ----- -----</tspan>
    <tspan x="16" dy="18">  ----- ----- -----</tspan>
    <tspan x="16" dy="18"> |  X  |  O  |  _  |</tspan>
    <tspan x="16" dy="18">  ----- ----- -----</tspan>
    <tspan x="16" dy="18">  ----- ----- -----</tspan>
    <tspan x="16" dy="18"> |  _  |  _  |  X  |</tspan>
    <tspan x="16" dy="18">  ----- ----- -----</tspan>
    <tspan x="16" dy="18"> </tspan>
    <tspan x="16" dy="18"> ( To retire, enter 0 0 )</tspan>
    <tspan x="16" dy="18">3 2</tspan>
  </text>
  <rect class="cursor" x="42" y="235" width="8" height="15"/>
</svg>
