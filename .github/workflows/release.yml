name: Release

# Pushing a tag vX.Y.Z publishes a GitHub Release with prebuilt binaries.
# Pull requests that touch this file run everything except the publish step.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: tictac-linux-x86_64
            ldflags: -static
          - os: macos-latest
            asset: tictac-macos-arm64
            ldflags: -static-libgfortran -static-libgcc -static-libquadmath
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install gfortran (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Install gfortran (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc

      - name: Test
        run: python3 tests/test_game.py

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gfortran TicTac.f90 -o tictac-check
          version="$(./tictac-check --version)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in TicTac.f90"
            exit 1
          fi

      - name: Build release binary
        run: |
          gfortran -O2 ${{ matrix.ldflags }} TicTac.f90 -o tictac
          ./tictac --version
          tar -czf ${{ matrix.asset }}.tar.gz tictac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
